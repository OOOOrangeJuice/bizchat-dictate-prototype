<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Copilot BizChat — Dictate Prototype</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --cp-bg: #f7f4ef;
    --cp-bg-elevated: #fcfbf8;
    --cp-surface: #ffffff;
    --cp-surface-soft: #f5f5f5;
    --cp-border: #dedede;
    --cp-border-strong: #919191;
    --cp-text: #242424;
    --cp-text-muted: #5c5c5c;
    --cp-text-soft: #6f6f6f;
    --cp-accent: #b11f4b;
    --cp-accent-hover: #9a1a41;
    --cp-accent-soft: rgba(177, 31, 75, 0.08);
    --cp-accent-ring: rgba(177, 31, 75, 0.35);
    --cp-accent-fg: #ffffff;
    --cp-neutral-ring: rgba(36, 36, 36, 0.25);
    --cp-success: #16a34a;
    --cp-danger: #dc2626;
    --cp-warning: #f59e0b;
    --cp-link: #0078d4;
    --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
    --cp-overlay: rgba(255, 255, 255, 0.8);
    --cp-panel: rgba(255, 255, 255, 0.86);
    --cp-panel-strong: rgba(255, 255, 255, 0.96);
    --cp-sheen: rgba(255, 255, 255, 0.55);
    --cp-highlight: rgba(177, 31, 75, 0.12);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --cp-bg: #3d3b3a;
    --cp-bg-elevated: #343231;
    --cp-surface: #292929;
    --cp-surface-soft: #2e2e2e;
    --cp-border: #474747;
    --cp-border-strong: #5f5f5f;
    --cp-text: #dedede;
    --cp-text-muted: #919191;
    --cp-text-soft: #b0b0b0;
    --cp-accent: #fd8ea1;
    --cp-accent-hover: #fb7b91;
    --cp-accent-soft: rgba(253, 142, 161, 0.14);
    --cp-accent-ring: rgba(253, 142, 161, 0.35);
    --cp-accent-fg: #1a1a1a;
    --cp-neutral-ring: rgba(222, 222, 222, 0.25);
    --cp-success: #4ade80;
    --cp-danger: #f87171;
    --cp-warning: #fbbf24;
    --cp-link: #4da6ff;
    --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
    --cp-overlay: rgba(41, 41, 41, 0.88);
    --cp-panel: rgba(41, 41, 41, 0.72);
    --cp-panel-strong: rgba(41, 41, 41, 0.96);
    --cp-sheen: rgba(255, 255, 255, 0.04);
    --cp-highlight: rgba(253, 142, 161, 0.12);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--cp-bg);
    color: var(--cp-text);
    font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  button, textarea, select { font: inherit; }
  button { color: inherit; }
  .icon { width: 18px; height: 18px; stroke-width: 1.8; flex: 0 0 auto; }
  .icon-btn {
    width: 36px;
    height: 36px;
    display: inline-grid;
    place-items: center;
    flex: 0 0 auto;
    border: 1px solid transparent;
    border-radius: 0.625rem;
    background: transparent;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--cp-surface-soft); border-color: var(--cp-border); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  .app {
    height: calc(100% - 4px);
    margin: 2px;
    display: grid;
    grid-template-columns: 284px minmax(0, 1fr);
    overflow: hidden;
    border: 1px solid var(--cp-border-strong);
    border-radius: 10px;
    background: var(--cp-surface);
    transition: grid-template-columns 260ms ease;
  }
  .app.nav-collapsed { grid-template-columns: 0px minmax(0, 1fr); }
  .app.nav-collapsed .sidebar { padding: 0; opacity: 0; pointer-events: none; border-color: transparent; }
  .nav-expand-btn {
    position: fixed; top: 12px; left: 12px; z-index: 30; opacity: 0; pointer-events: none;
    background: var(--cp-surface); border-color: var(--cp-border-strong); box-shadow: var(--cp-shadow);
    transition: opacity 200ms ease;
  }
  .nav-expand-btn.visible { opacity: 1; pointer-events: auto; }

  /* Sidebar */
  .sidebar { min-width: 0; background: var(--cp-bg-elevated); border-right: 1px solid var(--cp-border); display: flex; flex-direction: column; padding: 8px; overflow: hidden; transition: opacity 200ms ease, padding 200ms ease; }
  .brand-row { height: 43px; display: flex; align-items: center; gap: 5px; padding: 0 4px 0 11px; }
  .brand { font-weight: 650; font-size: 20px; line-height: 1; flex: 1; }
  .app-launcher { letter-spacing: 2px; font-size: 20px; line-height: 1; }
  .side-tabs { height: 35px; margin: 8px 0 20px; padding: 2px; display: grid; grid-template-columns: 1fr 1fr; border-radius: 16px; background: var(--cp-border); }
  .side-tab { border: 0; border-radius: 13px; background: transparent; color: var(--cp-text-muted); font-size: 13px; cursor: pointer; }
  .side-tab.active { background: var(--cp-surface); color: var(--cp-text); font-weight: 650; }
  .nav-stack, .pinned { display: grid; gap: 1px; }
  .nav-item, .new-chat {
    width: 100%; height: 35px; margin: 0; padding: 0 10px; display: flex; align-items: center; justify-content: flex-start;
    gap: 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; font-size: 14px; font-weight: 400;
    cursor: pointer; color: inherit;
  }
  .nav-item:hover, .new-chat:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
  .new-chat { background: var(--cp-border); font-weight: 650; margin-bottom: 4px; }
  .nav-label { margin: 23px 0 10px; padding: 0 10px; color: var(--cp-text-muted); font-size: 12px; font-weight: 400; }
  .pinned .nav-item { height: 33px; }
  .agent-glyph { width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--cp-surface-soft); color: var(--cp-text-muted); font-size: 12px; font-weight: 800; }
  .history { display: grid; gap: 0; overflow: hidden; }
  .history-item { width: 100%; height: 34px; border: 0; border-radius: 7px; padding: 0 10px; text-align: left; background: transparent; cursor: pointer; display: flex; align-items: center; }
  .history-item:hover { background: var(--cp-surface-soft); }
  .history-item.active { background: transparent; color: var(--cp-text); }
  .history-item.active .history-title { font-weight: 650; }
  .history-title { font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .sidebar-footer { margin-top: auto; border: 0; padding: 0; }
  .profile { height: 43px; display: flex; align-items: center; gap: 8px; padding: 0 8px; }
  .avatar { width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: var(--cp-border); color: var(--cp-text-muted); font-size: 12px; font-weight: 400; }
  .profile-copy { min-width: 0; flex: 1; }
  .profile-name { font-size: 13px; font-weight: 650; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .profile-name strong { padding: 1px 3px; border-radius: 3px; background: var(--cp-text); color: var(--cp-surface); font-size: 9px; font-weight: 700; }

  /* Workspace */
  .workspace { min-width: 0; height: 100%; display: flex; flex-direction: column; position: relative; background: var(--cp-surface); }
  .topbar { height: 62px; flex: 0 0 auto; display: flex; align-items: center; gap: 7px; padding: 0 18px; background: var(--cp-surface); }
  .mode-pill { height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: var(--cp-surface-soft); cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .auto-mode { height: 36px; padding: 0 8px; display: flex; align-items: center; gap: 3px; border: 0; background: transparent; cursor: pointer; color: var(--cp-text-muted); font-size: 13px; }
  .topbar-spacer { flex: 1; }
  .protect { color: var(--cp-success); }

  .chat-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .chat { width: min(760px, calc(100% - 40px)); min-height: 100%; margin: 0 auto; padding: 90px 0 200px; }
  .welcome { padding-top: 180px; text-align: center; animation: enter 480ms ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  h1 { margin: 0; font-size: 30px; font-weight: 500; line-height: 1.25; }
  .welcome-hint { margin: 10px 0 0; color: var(--cp-text-muted); font-size: 14px; }

  .message { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; margin-top: 28px; animation: enter 260ms ease both; }
  .message.user { grid-template-columns: minmax(0, 1fr); justify-items: end; }
  .message.user .bubble { max-width: 72%; padding: 12px 15px; border-radius: 14px; background: var(--cp-surface-soft); color: var(--cp-text); white-space: pre-wrap; }
  .assistant-icon { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--cp-border); border-radius: 8px; background: var(--cp-surface); color: var(--cp-text); font-weight: 750; }
  .answer { line-height: 1.65; font-size: 14px; }
  .answer p { margin: 0 0 10px; }
  .answer ul { margin: 8px 0; padding-left: 20px; }
  .answer li { margin: 5px 0; }
  .answer-title { font-weight: 700; font-size: 16px; margin: 0 0 8px; }
  .source-toggle { margin-top: 10px; padding: 6px 0; border: 0; background: transparent; color: var(--cp-link); font-size: 12px; cursor: pointer; }
  .sources { display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .sources.open { display: grid; }
  .source { padding: 10px; border: 1px solid var(--cp-border); border-radius: 8px; background: var(--cp-surface); font-size: 12px; }
  .source-type { color: var(--cp-text-muted); font-size: 10px; font-weight: 700; }
  .source-name { display: block; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .typing { display: flex; gap: 5px; padding: 10px 0; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--cp-text-muted); animation: pulse 1s infinite; }
  .typing i:nth-child(2) { animation-delay: 140ms; }
  .typing i:nth-child(3) { animation-delay: 280ms; }
  @keyframes pulse { 50% { opacity: .25; transform: translateY(-3px); } }

  /* Composer */
  .composer-wrap { position: absolute; left: 20px; right: 20px; bottom: 30%; padding: 0; background: transparent; }
  .workspace.chat-active .composer-wrap { top: auto; bottom: 18px; padding-top: 35px; background: linear-gradient(to bottom, transparent, var(--cp-surface) 32%); }
  .workspace.chat-active .quick-prompts { display: none; }

  .composer {
    position: relative;
    width: min(880px, 100%);
    margin: 0 auto;
    min-height: 56px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    border: 1px solid var(--cp-border-strong);
    border-radius: 28px;
    background: var(--cp-surface);
    box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    padding: 8px 8px 8px 18px;
  }
  .composer.flash { animation: flash-bg 900ms ease; }
  @keyframes flash-bg { 0% { background-color: var(--cp-surface-soft); } 100% { background-color: var(--cp-surface); } }
  textarea#promptInput {
    flex: 1; width: auto; min-height: 32px; max-height: 160px; padding: 8px 6px; line-height: 22px; font-size: 15px;
    resize: none; border: 0; outline: 0; background: transparent; color: var(--cp-text); overflow-y: auto;
  }
  textarea#promptInput::placeholder { color: var(--cp-text-muted); }
  textarea#promptInput:disabled { color: var(--cp-text-muted); }
  .composer-actions { display: flex; align-items: center; gap: 4px; padding-bottom: 2px; }

  .lang-pill {
    display: none; height: 32px; padding: 0 10px 0 12px; align-items: center; gap: 6px; border: 1px solid var(--cp-border);
    border-radius: 16px; background: var(--cp-surface-soft); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .lang-pill:hover { border-color: var(--cp-border-strong); color: var(--cp-text); }
  [data-scenario="manual-language"] .lang-pill { display: flex; }

  .mic-btn.listening { background: var(--cp-text); color: var(--cp-surface); animation: mic-pulse 1.4s ease-out infinite; }
  @keyframes mic-pulse {
    0% { box-shadow: 0 0 0 0 var(--cp-neutral-ring); }
    70% { box-shadow: 0 0 0 14px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }
  .send-btn { border-radius: 50%; background: var(--cp-text); color: var(--cp-surface); }
  .send-btn:hover { background: var(--cp-text-muted); color: var(--cp-surface); }
  .send-btn:disabled { opacity: .35; cursor: default; }

  .quick-prompts { margin: 14px auto 0; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .prompt-grid { display: flex; gap: 12px; }
  .prompt-card {
    width: auto; height: 45px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--cp-border);
    border-radius: 10px; background: var(--cp-surface); color: var(--cp-text-muted); white-space: nowrap; cursor: pointer; transition: background 140ms ease, color 140ms ease;
  }
  .prompt-card:hover { border-color: var(--cp-border); background: var(--cp-surface-soft); color: var(--cp-text); }
  .prompt-card strong { font-size: 14px; font-weight: 400; }
  .prompt-card .ms-mark { color: var(--cp-text-muted); font-size: 17px; }
  .more-prompts { border: 1px solid transparent; background: transparent; }

  /* Dictate status bar: listening + insights share this slot, anchored above the composer */
  .dictate-bar { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 10px; display: flex; justify-content: center; }
  .dictate-bar:empty { display: none; }
  .listening-card, .insights-card {
    width: min(760px, 100%); padding: 20px 24px; border: 1px solid var(--cp-border); border-radius: 20px;
    background: var(--cp-panel-strong); box-shadow: var(--cp-shadow); animation: enter 220ms ease both;
  }
  .listening-card { display: flex; align-items: center; gap: 18px; }
  .wave-bars { display: flex; align-items: center; gap: 4px; height: 28px; flex: 0 0 auto; }
  .wave-bars span { width: 4px; height: 100%; border-radius: 2px; background: var(--cp-text-muted); animation: wave-bounce 1s ease-in-out infinite; }
  .wave-bars span:nth-child(1) { animation-duration: .9s; }
  .wave-bars span:nth-child(2) { animation-duration: 1.1s; animation-delay: .1s; }
  .wave-bars span:nth-child(3) { animation-duration: .8s; animation-delay: .05s; }
  .wave-bars span:nth-child(4) { animation-duration: 1.2s; animation-delay: .15s; }
  .wave-bars span:nth-child(5) { animation-duration: 1s; animation-delay: .2s; }
  .wave-bars.settling span { animation-play-state: paused; transform: scaleY(.5); }
  @keyframes wave-bounce { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  .listening-copy { display: grid; text-align: left; }
  .listening-label { font-weight: 650; font-size: 17px; }
  .listening-sub { font-size: 15px; color: var(--cp-text-muted); margin-top: 2px; }

  .insights-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--cp-text-muted); margin-bottom: 12px; text-align: left; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: var(--cp-accent-soft);
    color: var(--cp-text); font-size: 15px; border: 0; text-align: left;
  }
  .chip .icon { width: 18px; height: 18px; color: var(--cp-accent); }
  .chip-action { cursor: pointer; }
  .chip-action:hover { background: var(--cp-highlight); }
  .compare-card { flex: 1 1 100%; padding: 14px 16px; border-radius: 14px; background: var(--cp-surface-soft); }
  .compare-before { font-size: 14px; color: var(--cp-text-muted); text-decoration: line-through; }
  .compare-after { margin-top: 7px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .compare-after .icon { width: 18px; height: 18px; color: var(--cp-success); flex: 0 0 auto; }
  .translation-card {
    flex: 1 1 100%; padding: 12px 16px; border-radius: 14px; background: var(--cp-surface-soft);
    display: flex; align-items: flex-start; gap: 8px; font-size: 14px; font-style: italic; color: var(--cp-text);
  }
  .translation-card .icon { width: 18px; height: 18px; color: var(--cp-text-muted); flex: 0 0 auto; margin-top: 1px; }

  /* Chips pop in one at a time (staggered via inline animation-delay) to draw attention */
  .chip, .compare-card, .translation-card { opacity: 0; animation: chip-pop 420ms cubic-bezier(.2, .9, .3, 1) both; }
  @keyframes chip-pop {
    0% { opacity: 0; transform: translateY(8px) scale(.9); }
    60% { opacity: 1; transform: translateY(-2px) scale(1.04); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Presenter controls */
  .presenter-panel {
    position: absolute; top: 74px; right: 18px; z-index: 25; width: 280px; padding: 14px;
    border: 1px dashed var(--cp-border-strong); border-radius: 14px; background: var(--cp-panel-strong);
    box-shadow: var(--cp-shadow); backdrop-filter: blur(6px);
  }
  .presenter-head { display: flex; align-items: center; gap: 8px; }
  .presenter-head-spacer { flex: 1; }
  .presenter-panel .presenter-body { margin-top: 10px; }
  .presenter-panel.collapsed .presenter-body { display: none; }
  .presenter-title { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--cp-text-muted); text-transform: uppercase; letter-spacing: .03em; }
  .presenter-title .icon { width: 14px; height: 14px; }
  .presenter-collapse-icon { transition: transform 200ms ease; }
  .presenter-panel.collapsed .presenter-collapse-icon { transform: rotate(180deg); }
  .autoplay-status { margin: 8px 0 0; font-size: 11px; font-weight: 650; color: var(--cp-text-muted); }
  .autoplay-status:empty { display: none; }
  .scenario-label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .presenter-label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 11px; color: var(--cp-text-muted); }

  /* Play All: one big red button when idle; splits into Pause + Stop icon buttons while running */
  .playback-controls { margin-bottom: 12px; }
  .play-all-btn {
    width: 100%; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 12px; background: var(--cp-accent); color: var(--cp-accent-fg);
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .play-all-btn:hover { background: var(--cp-accent-hover); }
  .play-all-btn .icon { width: 20px; height: 20px; }
  .playback-controls.running .play-all-btn { display: none; }
  .running-controls { display: none; gap: 8px; }
  .playback-controls.running .running-controls { display: flex; }
  .playback-icon-btn {
    flex: 1; height: 44px; display: flex; align-items: center; justify-content: center;
    border: 0; border-radius: 12px; cursor: pointer;
  }
  .playback-icon-btn .icon { width: 20px; height: 20px; }
  .pause-btn { background: var(--cp-border-strong); color: var(--cp-surface); }
  .pause-btn:hover { background: var(--cp-text-muted); }
  .pause-btn .icon-resume { display: none; }
  .pause-btn.paused { background: var(--cp-accent); color: var(--cp-accent-fg); }
  .pause-btn.paused:hover { background: var(--cp-accent-hover); }
  .pause-btn.paused .icon-pause { display: none; }
  .pause-btn.paused .icon-resume { display: block; }
  .stop-btn { background: var(--cp-text); color: var(--cp-surface); }
  .stop-btn:hover { background: var(--cp-border-strong); }

  .scenario-select { width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--cp-border); border-radius: 8px; background: var(--cp-surface); color: var(--cp-text); font-size: 13px; margin-bottom: 8px; cursor: pointer; }
  .presenter-tagline { margin: 0 0 10px; font-size: 12px; color: var(--cp-text-muted); line-height: 1.4; min-height: 32px; }
  .presenter-actions { display: flex; gap: 8px; }
  .presenter-btn { flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--cp-border); border-radius: 8px; background: var(--cp-surface); font-size: 12px; font-weight: 600; cursor: pointer; }
  .presenter-btn:hover { border-color: var(--cp-border-strong); color: var(--cp-text); }
  .presenter-note { margin: 10px 0 0; font-size: 10px; color: var(--cp-text-muted); line-height: 1.4; }

  /* Language menu (fixed, positioned via JS to escape composer clipping) */
  .lang-menu {
    position: fixed; z-index: 60; min-width: 210px; padding: 6px; border: 1px solid var(--cp-border); border-radius: 12px;
    background: var(--cp-panel-strong); box-shadow: var(--cp-shadow); display: none;
  }
  .lang-menu.open { display: block; }
  .lang-option { width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .lang-option:hover { background: var(--cp-surface-soft); }
  .lang-option.active { color: var(--cp-text); font-weight: 650; }

  /* Autoplay: locks real interaction so the ghost cursor drives the demo */
  .app.autoplay-active { pointer-events: none; }
  .app.autoplay-active .presenter-panel { pointer-events: auto; }

  .ghost-cursor {
    position: fixed; top: 0; left: 0; width: 22px; height: 22px; z-index: 300;
    pointer-events: none; opacity: 0; transform: translate(-3px, -3px);
    transition: left 650ms cubic-bezier(.4, 0, .2, 1), top 650ms cubic-bezier(.4, 0, .2, 1), opacity 200ms ease;
  }
  .ghost-cursor.visible { opacity: 1; }
  .ghost-cursor .icon { width: 22px; height: 22px; color: var(--cp-text); stroke-width: 2.1; filter: drop-shadow(0 2px 5px rgba(0, 0, 0, .35)); }
  .cursor-click-ring {
    position: fixed; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; border: 2px solid var(--cp-text-muted);
    pointer-events: none; z-index: 299; animation: click-ring-pulse 550ms ease-out forwards;
  }
  @keyframes click-ring-pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(4.5); } }

  .coach-tip {
    position: fixed; right: 40px; bottom: 150px; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px;
    background: var(--cp-text); color: var(--cp-surface); font-size: 12px; font-weight: 600; opacity: 0; transform: translateY(6px);
    transition: opacity 200ms ease, transform 200ms ease; pointer-events: none; z-index: 80;
  }
  .coach-tip .icon { width: 14px; height: 14px; }
  .coach-tip.visible { opacity: 1; transform: translateY(0); }

  /* Big center title card announcing which scenario just started. Stays until Dictate is
     clicked, then docks into a small plain label pinned to the top of the screen. */
  .scenario-announce {
    position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; gap: 10px; pointer-events: none; opacity: 0; text-align: center; padding: 0 24px;
    padding-top: 38vh; transition: opacity 320ms ease, padding-top 420ms cubic-bezier(.3, .7, .3, 1);
  }
  .scenario-announce.visible { opacity: 1; }
  .scenario-announce.docked { padding-top: 14px; gap: 2px; }
  .scenario-announce-label {
    font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; color: var(--cp-accent);
    transition: font-size 320ms ease, color 320ms ease, letter-spacing 320ms ease;
  }
  .scenario-announce-title {
    font-size: 30px; font-weight: 800; line-height: 1.15; color: var(--cp-text); max-width: 960px;
    background: var(--cp-panel-strong); padding: 18px 44px; border-radius: 26px; box-shadow: var(--cp-shadow); backdrop-filter: blur(10px);
    transition: font-size 320ms ease, color 320ms ease, background 320ms ease, padding 320ms ease, box-shadow 320ms ease;
  }
  .scenario-announce.docked .scenario-announce-label {
    font-size: 10px; font-weight: 400; color: var(--cp-text-muted); letter-spacing: .08em;
  }
  .scenario-announce.docked .scenario-announce-title {

  }

      scenarioAnnounceTitle.textContent = `"${scenario.label}" Feature`;
      scenarioAnnounce.classList.remove("docked");
      scenarioAnnounce.classList.add("visible");
    }

    // Shown once an autoplay run finishes all scenarios naturally (not on manual Stop).
    function showDemoComplete() {
      scenarioAnnounceLabel.style.display = "none";
      scenarioAnnounceTitle.textContent = "All Demo Complete. Thank you for watching!";
      scenarioAnnounce.classList.remove("docked");
      scenarioAnnounce.classList.add("visible");
    }

    function resetConversation() {
      if (dictateAbort) { dictateAbort.cancelled = true; dictateAbort.wake && dictateAbort.wake(); }
      isListening = false;
      chat.querySelectorAll(".message").forEach(m => m.remove());
      welcome.style.display = "";
      workspace.classList.remove("chat-active");
      input.value = "";
      input.disabled = false;
      input.readOnly = false;
      resizeInput();
      hideDictateBar();
      micButton.classList.remove("listening");
      micButton.setAttribute("aria-pressed", "false");
      scenarioAnnounce.classList.remove("docked");
      scenarioAnnounce.classList.add("visible");
      updateMicButtonMode();
      input.focus();
    }

    function updateMicButtonMode() {
      micButton.title = "Dictate";
      micButton.setAttribute("aria-label", "Dictate");
    }

    function updateLangPillLabel() {
      const scenario = SCENARIOS.find(s => s.id === "manual-language");
      langPillLabel.textContent = scenario.languages[currentLanguage].name;
    }

    /* ---------- Microphone permission (best effort, never blocks the demo) ---------- */
    function requestMicPermission() {
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => stream.getTracks().forEach(track => track.stop()))
            .catch(() => {});
        }
      } catch (err) { /* ignore — demo proceeds regardless of permission outcome */ }
    }

    /* ---------- Dictate flow: live-transcribes while "listening", then self-corrects if the ---------- */
    /* ---------- scenario defines a raw `before` heard vs. the understood `transcript` ---------- */
    function startDictation() {
      hideCoachTip();
      if (isListening) { cancelDictation(); return; }
      const scenario = currentScenario();
      isListening = true;
      hasUsedMic = true;
      sendButton.disabled = true;
      input.readOnly = true;
      scenarioAnnounce.classList.add("docked");

      let listeningConfig = scenario.listening;
      if (scenario.id === "manual-language") {
        const lang = scenario.languages[currentLanguage];
        listeningConfig = { label: "Listening…", sub: lang.listeningSub };
      }

      showListeningCard(listeningConfig);
      micButton.classList.add("listening");
      micButton.setAttribute("aria-pressed", "true");
      requestMicPermission();

      const abort = { cancelled: false, wake: null };
      dictateAbort = abort;
      runDictation(scenario, abort);
    }

    function cancelDictation() {
      if (dictateAbort) { dictateAbort.cancelled = true; dictateAbort.wake && dictateAbort.wake(); }
      isListening = false;
      micButton.classList.remove("listening");
      micButton.setAttribute("aria-pressed", "false");
      input.readOnly = false;
      hideDictateBar();
      resizeInput();
    }

    // Resolves after `ms`, or immediately if `abort.wake()` is called (used to cancel mid-wait).
    function dictateSleep(ms, abort) {
      return new Promise(resolve => {
        const timer = window.setTimeout(resolve, ms);
        abort.wake = () => { window.clearTimeout(timer); resolve(); };
      });
    }

    // Live-types `text` into the composer, character by character, while the listening card stays visible.
    function typeLive(text, abort) {
      return new Promise(resolve => {
        input.value = "";
        let index = 0;
        const totalDuration = Math.min(2200, Math.max(900, text.length * 20));
        const stepTime = Math.max(14, totalDuration / text.length);
        const timer = window.setInterval(() => {
          index += 1;
          input.value = text.slice(0, index);
          resizeInput();
          if (index >= text.length) { window.clearInterval(timer); resolve(); }
        }, stepTime);
        abort.wake = () => { window.clearInterval(timer); resolve(); };
      });
    }

    // Swaps the live-heard text for the understood/corrected text, with a highlight flash.
    function correctLiveText(finalText, abort) {
      return new Promise(resolve => {
        input.value = finalText;
        resizeInput();
        composerEl.classList.remove("flash");
        void composerEl.offsetWidth;
        composerEl.classList.add("flash");
        const timer = window.setTimeout(resolve, 550);
        abort.wake = () => { window.clearTimeout(timer); resolve(); };
      });
    }

    function updateListeningLabel(label, sub) {
      const labelEl = dictateBar.querySelector(".listening-label");
      const subEl = dictateBar.querySelector(".listening-sub");
      if (labelEl) labelEl.textContent = label;
      if (subEl) subEl.textContent = sub;
      statusRegion.textContent = `${label} ${sub}`;
    }

    async function runDictation(scenario, abort) {
      await dictateSleep(rand(350, 650), abort);
      if (abort.cancelled) return;

      let finalText, liveText, chips, title;
      if (scenario.id === "manual-language") {
        const lang = scenario.languages[currentLanguage];
        finalText = lang.transcript; liveText = lang.transcript; chips = lang.chips; title = scenario.insightsTitle;
      } else {
        finalText = scenario.transcript; liveText = scenario.before || scenario.transcript;
        chips = scenario.chips; title = scenario.insightsTitle;
      }

      await typeLive(liveText, abort);
      if (abort.cancelled) return;

      if (scenario.before) {
        const refining = scenario.refining || { label: "Refining recognition…", sub: "Double-checking names and terms" };
        updateListeningLabel(refining.label, refining.sub);
        await dictateSleep(rand(500, 750), abort);
        if (abort.cancelled) return;
        await correctLiveText(finalText, abort);
        if (abort.cancelled) return;
      }

      await dictateSleep(300, abort);
      if (abort.cancelled) return;
      finishDictationSettled(chips, title);
    }

    function finishDictationSettled(chips, title) {
      isListening = false;
      micButton.classList.remove("listening");
      micButton.setAttribute("aria-pressed", "false");
      input.readOnly = false;
      renderInsights(chips, title);
      sendButton.disabled = !input.value.trim();
      updateMicButtonMode();
    }

    /* ---------- Dictate status bar rendering ---------- */
    function showListeningCard(config) {
      dictateBar.innerHTML = `
        <div class="listening-card">
          <div class="wave-bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
          <div class="listening-copy">
            <div class="listening-label">${escapeHtml(config.label)}</div>
            <div class="listening-sub">${escapeHtml(config.sub)}</div>
          </div>
        </div>`;
      statusRegion.textContent = `${config.label} ${config.sub}`;
    }

    function hideDictateBar() { dictateBar.innerHTML = ""; }

    function chipHTML(chip, index) {
      const delay = `animation-delay:${index * 220}ms`;
      if (chip.type === "translation") {
        return `<div class="translation-card" style="${delay}"><i data-lucide="languages" class="icon"></i><span>${escapeHtml(chip.text)}</span></div>`;
      }
      if (chip.type === "compare") {
        return `<div class="compare-card" style="${delay}">
            <div class="compare-before">${escapeHtml(chip.before)}</div>
            <div class="compare-after"><i data-lucide="check" class="icon"></i>${escapeHtml(chip.after)}</div>
          </div>`;
      }
      if (chip.type === "action") {
        return `<button class="chip chip-action" style="${delay}" data-action="${escapeHtml(chip.action)}"><i data-lucide="${chip.icon}" class="icon"></i>${escapeHtml(chip.text)}</button>`;
      }
      return `<span class="chip" style="${delay}"><i data-lucide="${chip.icon}" class="icon"></i>${escapeHtml(chip.text)}</span>`;
    }

    function renderInsights(chips, title) {
      dictateBar.innerHTML = `
        <div class="insights-card">
          <div class="insights-title">${escapeHtml(title)}</div>
          <div class="chip-row">${chips.map((chip, index) => chipHTML(chip, index)).join("")}</div>
        </div>`;
      renderIcons();
      dictateBar.querySelectorAll(".chip-action").forEach(btn => {
        btn.addEventListener("click", () => { if (btn.dataset.action === "startDictation") startDictation(); });
      });
      statusRegion.textContent = `${title}. Transcript ready to edit or send.`;
    }

    function hideCoachTip() { coachTip.classList.remove("visible"); }

    /* ---------- Chat rendering ---------- */
    function appendUserMessage(text) {
      const message = document.createElement("div");
      message.className = "message user";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      message.appendChild(bubble);
      chat.appendChild(message);
    }

    function appendTyping() {
      const message = document.createElement("div");
      message.className = "message";
      message.id = "typingMessage";
      message.innerHTML = '<div class="assistant-icon">C</div><div class="typing"><i></i><i></i><i></i></div>';
      chat.appendChild(message);
    }

    function appendAnswer(reply) {
      document.getElementById("typingMessage")?.remove();
      const message = document.createElement("div");
      message.className = "message";
      const hasSources = reply.sources && reply.sources.length;
      const sourcesHtml = hasSources
        ? reply.sources.map(s => `<div class="source"><span class="source-type">${escapeHtml(s.type)}</span><span class="source-name">${escapeHtml(s.name)}</span></div>`).join("")
        : "";
      message.innerHTML = `
        <div class="assistant-icon">C</div>
        <div class="answer">
          <p class="answer-title">${escapeHtml(reply.title)}</p>
          ${reply.html}
          ${hasSources ? `<button class="source-toggle" aria-expanded="false">View ${reply.sources.length} source${reply.sources.length > 1 ? "s" : ""}</button><div class="sources">${sourcesHtml}</div>` : ""}
        </div>`;
      chat.appendChild(message);
      const toggle = message.querySelector(".source-toggle");
      if (toggle) {
        const sources = message.querySelector(".sources");
        toggle.addEventListener("click", () => {
          const open = sources.classList.toggle("open");
          toggle.setAttribute("aria-expanded", String(open));
          toggle.textContent = open ? "Hide sources" : `View ${reply.sources.length} source${reply.sources.length > 1 ? "s" : ""}`;
        });
      }
      scrollToLatest();
    }

    function getCurrentReply() {
      const scenario = currentScenario();
      return scenario.id === "manual-language" ? scenario.languages[currentLanguage].reply : scenario.reply;
    }

    function sendPrompt(text) {
      if (isListening) return;
      text = (text ?? input.value).trim();
      if (!text) return;
      welcome.style.display = "none";
      workspace.classList.add("chat-active");
      hideDictateBar();
      appendUserMessage(text);
      input.value = "";
      resizeInput();
      appendTyping();
      scrollToLatest();
      const reply = getCurrentReply();
      window.setTimeout(() => appendAnswer(reply), 1100 + Math.random() * 400);
      updateMicButtonMode();
    }

    /* ---------- Language pill + menu ---------- */
    function buildLangMenu() {
      const scenario = SCENARIOS.find(s => s.id === "manual-language");
      langMenu.innerHTML = Object.entries(scenario.languages).map(([code, lang]) =>
        `<button class="lang-option ${code === currentLanguage ? "active" : ""}" data-lang="${code}">${escapeHtml(lang.name)}</button>`
      ).join("");
      langMenu.querySelectorAll(".lang-option").forEach(btn => {
        btn.addEventListener("click", () => {
          currentLanguage = btn.dataset.lang;
          updateLangPillLabel();
          closeLangMenu();
          langPill.focus();
        });
      });
    }
    function openLangMenu() {
      buildLangMenu();
      const rect = langPill.getBoundingClientRect();
      langMenu.style.top = `${rect.bottom + 6}px`;
      langMenu.style.left = `${rect.left}px`;
      langMenu.classList.add("open");
    }
    function closeLangMenu() { langMenu.classList.remove("open"); }

    /* ---------- Autoplay: ghost cursor drives the same UI a presenter would click ---------- */
    function rawWait(ms) {
      return new Promise(resolve => {
        autoplayResolve = resolve;
        autoplayTimer = window.setTimeout(() => { autoplayResolve = null; resolve(); }, ms);
      });
    }
    // Waits `ms` in small chunks so Pause can hold (without burning the wait budget) and Stop
    // can interrupt within ~100ms, instead of only being checked after one long timer fires.
    async function sleep(ms) {
      let remaining = ms;
      while (remaining > 0 && !autoplayCancelled) {
        const chunk = Math.min(100, remaining);
        const chunkStart = performance.now();
        await rawWait(chunk);
        if (autoplayCancelled) return;
        remaining -= performance.now() - chunkStart;
        while (autoplayPaused && !autoplayCancelled) {
          await rawWait(120);
        }
      }
    }
    function stopAutoplay() {
      autoplayCancelled = true;
      window.clearTimeout(autoplayTimer);
      if (autoplayResolve) { const wake = autoplayResolve; autoplayResolve = null; wake(); }
    }
    function setPlayButtonState(playing) {
      playbackControls.classList.toggle("running", playing);
      playAllLabel.textContent = "Play All";
    }
    function setPauseButtonState(paused) {
      pauseBtn.classList.toggle("paused", paused);
      pauseBtn.title = paused ? "Resume" : "Pause";
      pauseBtn.setAttribute("aria-label", paused ? "Resume" : "Pause");
    }
    function showGhostCursor() {
      const rect = playbackControls.getBoundingClientRect();
      ghostCursor.style.transition = "none";
      ghostCursor.style.left = `${rect.left + rect.width / 2}px`;
      ghostCursor.style.top = `${rect.top + rect.height / 2}px`;
      void ghostCursor.offsetWidth;
      ghostCursor.style.transition = "";
      ghostCursor.classList.add("visible");
    }
    function hideGhostCursor() { ghostCursor.classList.remove("visible"); }
    function moveCursorTo(el) {
      if (!el) return Promise.resolve();
      const rect = el.getBoundingClientRect();
      ghostCursor.style.left = `${rect.left + rect.width / 2}px`;
      ghostCursor.style.top = `${rect.top + rect.height / 2}px`;
      return sleep(650);
    }
    function spawnClickRing(el) {
      const rect = el.getBoundingClientRect();
      const ring = document.createElement("div");
      ring.className = "cursor-click-ring";
      ring.style.left = `${rect.left + rect.width / 2}px`;
      ring.style.top = `${rect.top + rect.height / 2}px`;
      document.body.appendChild(ring);
      ring.addEventListener("animationend", () => ring.remove());
    }
    async function ghostClick(el) {
      if (autoplayCancelled || !el) return;
      await moveCursorTo(el);
      if (autoplayCancelled) return;
      spawnClickRing(el);
      await sleep(180);
      if (autoplayCancelled) return;
      el.click();
      await sleep(260);
    }
    async function ghostSelectScenario(id) {
      await moveCursorTo(scenarioSelect);
      if (autoplayCancelled) return;
      spawnClickRing(scenarioSelect);
      await sleep(200);
      if (autoplayCancelled) return;
      applyScenario(id);
    }
    async function ghostDemoLanguage(code) {
      await ghostClick(langPill);
      if (autoplayCancelled) return;
      await sleep(250);
      const optionEl = langMenu.querySelector(`.lang-option[data-lang="${code}"]`);
      await ghostClick(optionEl);
    }
    async function waitForDictateSettled(timeoutMs = 9000) {
      const start = performance.now();
      while (!autoplayCancelled && (isListening || sendButton.disabled) && performance.now() - start < timeoutMs) {
        await sleep(120);
      }
    }
    function finishAutoplay() {
      autoplayRunning = false;
      autoplayPaused = false;
      appEl.classList.remove("autoplay-active");
      scenarioSelect.disabled = false;
      replayBtn.disabled = false;
      setPlayButtonState(false);
      setPauseButtonState(false);
      hideGhostCursor();
      autoplayStatus.textContent = "";
    }
    async function playAllScenarios() {
      if (autoplayRunning) return;
      autoplayRunning = true;
      autoplayCancelled = false;
      autoplayPaused = false;
      hideCoachTip();
      appEl.classList.add("autoplay-active");
      scenarioSelect.disabled = true;
      replayBtn.disabled = true;
      setPlayButtonState(true);
      setPauseButtonState(false);
      showGhostCursor();
      await sleep(400);

      for (let i = 0; i < SCENARIOS.length && !autoplayCancelled; i++) {
        const scenario = SCENARIOS[i];
        autoplayStatus.textContent = `Playing ${i + 1} / ${SCENARIOS.length} · ${scenario.priority} · ${scenario.label}`;

        await ghostSelectScenario(scenario.id);
        if (autoplayCancelled) break;
        await sleep(900);

        if (scenario.id === "manual-language") {
          await ghostDemoLanguage("zh");
          if (autoplayCancelled) break;
          await sleep(500);
        }

        await ghostClick(micButton);
        if (autoplayCancelled) break;
        await waitForDictateSettled();
        if (autoplayCancelled) break;
        await sleep(5000); // let the presenter read the insight highlights before sending

        if (autoplayCancelled) break;
        await ghostClick(sendButton);
        if (autoplayCancelled) break;
        await sleep(2800);
      }

      if (!autoplayCancelled) showDemoComplete();
      finishAutoplay();
    }

    /* ---------- Event wiring ---------- */
    input.addEventListener("input", () => { resizeInput(); if (input.value.trim()) hideCoachTip(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && isListening) cancelDictation();
      if (e.key === "Escape" && autoplayRunning) { stopAutoplay(); finishAutoplay(); }
    });

    sendButton.addEventListener("click", () => sendPrompt());
    micButton.addEventListener("click", startDictation);

    document.querySelectorAll(".prompt-card").forEach(card => card.addEventListener("click", () => sendPrompt(card.dataset.prompt)));

    newChatButton.addEventListener("click", resetConversation);
    document.querySelectorAll(".history-item").forEach(item => item.addEventListener("click", () => {
      document.querySelectorAll(".history-item").forEach(h => h.classList.remove("active"));
      item.classList.add("active");
    }));

    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
    });

    function setNavCollapsed(collapsed) {
      appEl.classList.toggle("nav-collapsed", collapsed);
      navExpandBtn.classList.toggle("visible", collapsed);
    }
    sidebarToggle.addEventListener("click", () => setNavCollapsed(true));
    navExpandBtn.addEventListener("click", () => setNavCollapsed(false));

    langPill.addEventListener("click", (e) => {
      e.stopPropagation();
      langMenu.classList.contains("open") ? closeLangMenu() : openLangMenu();
    });
    document.addEventListener("click", (e) => {
      if (!langMenu.contains(e.target) && e.target !== langPill && !langPill.contains(e.target)) closeLangMenu();
    });
    window.addEventListener("resize", closeLangMenu);

    scenarioSelect.addEventListener("change", () => applyScenario(scenarioSelect.value));
    replayBtn.addEventListener("click", resetConversation);
    presenterCollapse.addEventListener("click", () => presenterPanel.classList.toggle("collapsed"));
    playAllBtn.addEventListener("click", () => {
      if (autoplayRunning) return;
      resetConversation();
      playAllScenarios();
    });
    stopBtn.addEventListener("click", () => {
      if (!autoplayRunning) return;
      stopAutoplay();
      finishAutoplay();
    });
    pauseBtn.addEventListener("click", () => {
      if (!autoplayRunning) return;
      autoplayPaused = !autoplayPaused;
      setPauseButtonState(autoplayPaused);
    });

    /* ---------- Init ---------- */
    scenarioSelect.innerHTML = SCENARIOS.map(s => `<option value="${s.id}">${s.priority} · ${escapeHtml(s.label)}</option>`).join("");
    applyScenario(currentScenarioId);
    setNavCollapsed(true);
    renderIcons();
    window.setTimeout(() => { if (!hasUsedMic) coachTip.classList.add("visible"); }, 900);
  </script>
</body>
</html>
